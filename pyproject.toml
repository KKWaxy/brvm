[project]
name = "sgi"
version = "0.1.0"
description = "FastAPI application for managing SGI (Sociétés de Gestion d'Intermédiaires) data with SQLite/PostgreSQL support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Contributors", email = "contact@example.com"}]
license = {text = "MIT"}
keywords = ["fastapi", "sgi", "api", "database", "sqlalchemy", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Database",
]
homepage = "https://github.com/yourusername/sgi"
repository = "https://github.com/yourusername/sgi"
documentation = "https://github.com/yourusername/sgi"
issues = "https://github.com/yourusername/sgi/issues"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
