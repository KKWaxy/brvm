version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sgi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sgi_pass}
      - POSTGRES_DB=${POSTGRES_DB:-sgi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sgi_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-sgi}:${POSTGRES_PASSWORD:-sgi_pass}@postgres:5432/${POSTGRES_DB:-sgi_db}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretlocal}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      - ./:/app:cached
      - ./data:/app/data
    ports:
      - '8000:8000'
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend_dev:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - ./scripts/wait-for-backend.sh:/wait-for-backend.sh:ro
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8000}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000/health}
    command: sh -c "apk add --no-cache curl && sh /wait-for-backend.sh && npm install --silent && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8000}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data: {}
